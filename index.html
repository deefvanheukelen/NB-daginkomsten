<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c83763"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>NB-daginkomsten</title></head><body><main class="shell"><header><div class="brand"><span class="mark">NB</span><div><strong>NB-daginkomsten</strong><small>Jouw afspraken en inkomsten</small></div></div><button id="logout" hidden>Uitloggen</button></header><section id="setup" class="panel" hidden><h2>Eenmalige configuratie</h2><p>Vul de URL en publieke anon/publishable key van dezelfde Supabase-projectomgeving als NailBooker in.</p><label>Supabase URL<input id="url" placeholder="https://xxxxx.supabase.co"></label><label>Publieke Supabase key<input id="key" placeholder="sb_publishable_..."></label><button id="saveConfig">Opslaan</button><p class="hint">Gebruik nooit een service_role of secret key in de browser.</p></section><section id="login" class="panel" hidden><h2>Aanmelden</h2><form id="loginForm"><label>E-mailadres<input type="email" id="email" required autocomplete="username"></label><label>Wachtwoord<input type="password" id="password" required autocomplete="current-password"></label><button type="submit">Inloggen</button></form></section><section id="app" hidden><div class="switch"><button id="dayTab" class="active">Dag</button><button id="monthTab">Maand</button></div><div class="controls"><button id="prev" aria-label="Vorige">‹</button><div id="dayControls"><button id="dateButton">Datum kiezen</button><input type="date" id="dateInput" aria-label="Datum kiezen"></div><div id="monthControls" hidden><select id="monthSelect" aria-label="Maand"></select><select id="yearSelect" aria-label="Jaar"></select></div><button id="next" aria-label="Volgende">›</button></div><div id="summary" class="summary"></div><div id="entries" class="entries"></div></section><p id="status" role="status"></p><footer>NB-daginkomsten · NailBooker</footer></main><script type="module" src="app.js"></script></body></html>
